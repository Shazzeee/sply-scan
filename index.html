<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPLY Scan</title>
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --paper:#F3EEE3;
  --paper2:#EAE3D3;
  --ink:#1C1A16;
  --rust:#B54E28;
  --rust-dark:#8f3c1e;
  --moss:#4B6653;
  --line:#D6CEBB;
  --muted:#8C8370;
  --white:#FFFDF8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--ink);height:100%;overscroll-behavior:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
  background:var(--ink);
}

/* ---------- HEADER ---------- */
.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px 12px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom:2px solid var(--rust);
  flex-shrink:0;
}
.brand{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.brand span{color:var(--rust);}
.count-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  letter-spacing:0.02em;
}

/* ---------- SCANNER AREA ---------- */
.scan-wrap{
  flex:1;
  position:relative;
  background:#0e0d0b;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  min-height:280px;
}
#reader{
  width:100% !important;
  max-width:520px;
}
#reader video{
  object-fit:cover;
  border-radius:0;
}
#reader img{display:none;}

.idle-state{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:24px;
  text-align:center;
}
.idle-icon{
  width:64px;height:64px;
  border:2px solid var(--rust);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.idle-icon svg{width:30px;height:30px;stroke:var(--rust);}
.idle-text{
  font-family:'Oswald',sans-serif;
  color:var(--paper);
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.idle-sub{
  color:var(--muted);
  font-size:13px;
  max-width:280px;
}

/* viewfinder corners overlay */
.viewfinder{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:78%;
  max-width:380px;
  aspect-ratio:2.2/1;
  pointer-events:none;
  z-index:5;
}
.corner{
  position:absolute;
  width:28px;height:28px;
  border-color:var(--rust);
  border-style:solid;
  border-width:0;
}
.corner.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;}
.corner.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;}
.corner.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;}
.corner.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;}
.scan-line{
  position:absolute;
  left:4%;right:4%;
  height:2px;
  background:var(--rust);
  box-shadow:0 0 8px var(--rust);
  top:0;
  animation:sweep 2.2s ease-in-out infinite;
}
@keyframes sweep{
  0%,100%{top:6%;opacity:0.9;}
  50%{top:92%;opacity:0.5;}
}

/* ---------- CONTROLS ---------- */
.controls{
  background:var(--paper);
  padding:16px 18px 18px;
  flex-shrink:0;
  border-top:1px solid var(--line);
}
.btn-scan{
  width:100%;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:16px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:15px;
  background:var(--rust);
  color:var(--white);
  border:none;
  border-radius:3px;
  cursor:pointer;
  transition:background .15s ease;
}
.btn-scan:active{background:var(--rust-dark);}
.btn-scan.stop{background:var(--ink);}

.manual-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.manual-row input{
  flex:1;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:3px;
  background:var(--white);
  color:var(--ink);
  min-width:0;
}
.manual-row input:focus{outline:2px solid var(--rust); outline-offset:-1px;}
.manual-row button{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:0.03em;
  padding:0 16px;
  background:var(--ink);
  color:var(--paper);
  border:none;
  border-radius:3px;
  cursor:pointer;
}
.hint{
  margin-top:10px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}

/* ---------- RESULT SHEET (swing tag) ---------- */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:50;
  display:none;
  align-items:flex-end;
}
.overlay.show{display:flex;}
.tag-sheet{
  width:100%;
  max-height:92vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:16px 16px 0 0;
  padding:0 20px 18px;
  animation:slideUp .28s cubic-bezier(.2,.8,.3,1);
  position:relative;
}
@keyframes slideUp{
  from{transform:translateY(100%);}
  to{transform:translateY(0);}
}
.tag-handle{
  width:36px;height:4px;
  background:var(--line);
  border-radius:2px;
  margin:8px auto 4px;
}
.tag-punch{
  display:none;
}
.tag-close{
  position:absolute;
  top:10px; right:14px;
  width:30px;height:30px;
  border:none;
  background:none;
  color:var(--muted);
  font-size:22px;
  cursor:pointer;
  line-height:1;
}
.tag-header{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:8px 0 10px;
  border-bottom:1px dashed var(--line);
}
.tag-photo-sm{
  width:56px;height:56px;
  flex-shrink:0;
  border-radius:6px;
  background:var(--paper2);
  border:1px solid var(--line);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.tag-photo-sm img{width:100%;height:100%;object-fit:cover;display:block;}
.tag-photo-sm svg{width:22px;height:22px;stroke:var(--muted);}
.tag-header-text{ min-width:0; padding-right:26px; }
.tag-cat{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.07em;
  color:var(--rust);
  font-weight:700;
}
.tag-vendor{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--muted);
  margin-top:1px;
}
.tag-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:16px;
  line-height:1.2;
  margin-top:4px;
}

.tag-photo{
  margin-top:10px;
  width:100%;
  max-height:150px;
  aspect-ratio:16/9;
  border-radius:8px;
  background:var(--paper2);
  border:1px dashed var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--muted);
  overflow:hidden;
}
.tag-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.tag-photo svg{width:28px;height:28px;stroke:var(--muted);}
.tag-photo span{font-size:11px;font-family:'JetBrains Mono',monospace;}

.tag-fields{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 16px;
}
.tag-field{
  border-left:2px solid var(--line);
  padding-left:10px;
}
.tag-field .lbl{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.tag-field .val{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  margin-top:1px;
  word-break:break-word;
}

.tag-cta-link{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:8px;
  color:var(--muted);
  text-decoration:underline;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
}

.not-found{
  padding:40px 20px;
  text-align:center;
}
.not-found .big{
  font-family:'Oswald',sans-serif;
  font-size:20px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.not-found .small{
  color:var(--muted);
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
}

/* ---------- TAB BAR ---------- */
.tabbar{
  display:flex;
  background:var(--ink);
  border-top:2px solid var(--rust);
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-btn{
  flex:1;
  background:none;
  border:none;
  padding:12px 8px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  color:var(--muted);
  cursor:pointer;
  position:relative;
  font-family:'Oswald',sans-serif;
}
.tab-btn svg{width:22px;height:22px;stroke:var(--muted);}
.tab-btn.active{color:var(--paper);}
.tab-btn.active svg{stroke:var(--rust);}
.tab-btn .lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;}
.tab-badge{
  position:absolute;
  top:6px; right:calc(50% - 26px);
  min-width:16px; height:16px;
  padding:0 4px;
  background:var(--rust);
  color:var(--white);
  border-radius:8px;
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  display:flex; align-items:center; justify-content:center;
}
.tab-badge.hidden{display:none;}

/* ---------- DELIVERY SCREEN ---------- */
.screen{ flex:1; display:flex; flex-direction:column; min-height:0; }
.screen.hidden{ display:none; }
.delivery-header{
  background:var(--paper);
  padding:16px 18px 12px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.delivery-title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:19px;
  text-transform:uppercase;
  color:var(--ink);
  margin-bottom:10px;
}
.delivery-meta{
  display:flex;
  gap:8px;
}
.delivery-meta input{
  flex:1;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:3px;
  background:var(--white);
  min-width:0;
}
.delivery-list{
  flex:1;
  overflow-y:auto;
  background:var(--paper2);
  padding:10px 14px;
}
.delivery-empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
}
.delivery-row{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}
.delivery-row img{
  width:44px;height:44px;
  object-fit:cover;
  border-radius:4px;
  flex-shrink:0;
  background:var(--paper2);
}
.delivery-row .ph{
  width:44px;height:44px;
  border-radius:4px;
  background:var(--paper2);
  flex-shrink:0;
}
.delivery-row .info{ flex:1; min-width:0; }
.delivery-row .t{
  font-family:'Oswald',sans-serif;
  font-size:13px;
  font-weight:500;
  line-height:1.25;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.delivery-row .s{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  margin-top:2px;
}
.delivery-row .qty{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:15px;
  color:var(--rust);
  flex-shrink:0;
  min-width:28px;
  text-align:center;
}
.delivery-row .rm{
  background:none;
  border:none;
  color:var(--muted);
  font-size:20px;
  padding:2px 4px;
  flex-shrink:0;
  cursor:pointer;
}
.delivery-footer{
  background:var(--paper);
  padding:14px 18px;
  border-top:1px solid var(--line);
  flex-shrink:0;
}
.delivery-total{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-bottom:10px;
  text-align:center;
}
.delivery-total b{color:var(--ink); font-size:14px;}
.btn-row{ display:flex; gap:10px; }
.btn-export{
  flex:1;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:13px;
  background:var(--moss);
  color:var(--white);
  border:none;
  border-radius:3px;
  cursor:pointer;
}
.btn-clear{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  text-transform:uppercase;
  padding:13px 16px;
  background:none;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:3px;
  cursor:pointer;
}

/* ---------- QTY STEPPER (in result sheet) ---------- */
.qty-block{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}
.qty-label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  margin-bottom:6px;
}
.qty-stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.qty-btn{
  width:42px;height:42px;
  border-radius:50%;
  border:2px solid var(--ink);
  background:var(--white);
  font-size:22px;
  font-weight:700;
  color:var(--ink);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  line-height:1;
  user-select:none;
}
.qty-btn:active{background:var(--ink); color:var(--white);}
.qty-value{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:28px;
  width:64px;
  text-align:center;
  border:2px solid var(--line);
  border-radius:6px;
  background:var(--white);
  color:var(--ink);
  padding:4px 2px;
  -moz-appearance:textfield;
}
.qty-value:focus{ outline:none; border-color:var(--rust); }
.qty-value::-webkit-outer-spin-button,
.qty-value::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.btn-add-cart{
  display:block;
  width:100%;
  text-align:center;
  margin-top:10px;
  padding:13px;
  background:var(--rust);
  color:var(--white);
  border:none;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  border-radius:3px;
  cursor:pointer;
}
.btn-add-cart:active{background:var(--rust-dark);}

/* ---------- CONFIRM VIEW (2nd validation) ---------- */
.confirm-box{
  text-align:center;
  padding:10px 0 4px;
}
.confirm-photo{
  width:120px;height:120px;
  border-radius:8px;
  object-fit:cover;
  margin:0 auto 14px;
  display:block;
  background:var(--paper2);
}
.confirm-title{
  font-family:'Oswald',sans-serif;
  font-size:17px;
  font-weight:600;
  margin-bottom:6px;
}
.confirm-qty{
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  color:var(--muted);
  margin-bottom:20px;
}
.confirm-qty b{
  color:var(--rust);
  font-size:22px;
}
.confirm-actions{ display:flex; gap:10px; margin-top:6px; }
.btn-confirm-back{
  flex:1;
  padding:14px;
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  font-family:'Oswald',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  font-size:13px;
  border-radius:3px;
  cursor:pointer;
}
.btn-confirm-ok{
  flex:2;
  padding:14px;
  background:var(--moss);
  color:var(--white);
  border:none;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  font-size:14px;
  border-radius:3px;
  cursor:pointer;
}
.toast{
  position:fixed;
  bottom:90px; left:50%;
  transform:translateX(-50%);
  background:var(--moss);
  color:var(--white);
  padding:12px 20px;
  border-radius:20px;
  font-family:'Oswald',sans-serif;
  font-size:13px;
  font-weight:600;
  z-index:80;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

/* ---------- RECHERCHE (accessible) ---------- */
.search-header{
  background:var(--paper);
  padding:16px 18px 12px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.search-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.search-title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:19px;
  text-transform:uppercase;
  color:var(--ink);
}
.btn-textsize{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:700;
  padding:9px 14px;
  min-height:44px;
  background:var(--ink);
  color:var(--paper);
  border:none;
  border-radius:22px;
  cursor:pointer;
}
.btn-textsize.big{ background:var(--rust); }
.search-input-wrap{
  position:relative;
}
#searchInput{
  width:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:18px;
  padding:16px 46px 16px 16px;
  min-height:56px;
  border:2px solid var(--ink);
  border-radius:8px;
  background:var(--white);
  color:var(--ink);
}
#searchInput:focus{ outline:3px solid var(--rust); outline-offset:1px; }
.search-clear{
  position:absolute;
  right:8px; top:50%;
  transform:translateY(-50%);
  width:38px; height:38px;
  border:none;
  background:var(--line);
  color:var(--ink);
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
}
.search-clear.show{ display:flex; }

.filter-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 18px 4px;
  flex-shrink:0;
  -webkit-overflow-scrolling:touch;
}
.filter-chip{
  flex-shrink:0;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:700;
  padding:10px 16px;
  min-height:44px;
  border:2px solid var(--ink);
  background:var(--white);
  color:var(--ink);
  border-radius:22px;
  cursor:pointer;
  white-space:nowrap;
}
.filter-chip.active{
  background:var(--ink);
  color:var(--paper);
}

.search-status{
  padding:10px 18px 0;
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
  color:var(--muted);
  flex-shrink:0;
}

.search-list{
  flex:1;
  overflow-y:auto;
  background:var(--paper2);
  padding:10px 14px 20px;
}
.search-list.big-text .s-title{ font-size:19px; }
.search-list.big-text .s-vendor{ font-size:15px; }

.search-empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-size:15px;
}
.search-row{
  width:100%;
  text-align:left;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  min-height:64px;
}
.search-row:focus{ outline:3px solid var(--rust); outline-offset:1px; }
.search-row img{
  width:52px;height:52px;
  object-fit:cover;
  border-radius:6px;
  flex-shrink:0;
  background:var(--paper2);
}
.search-row .ph{
  width:52px;height:52px;
  border-radius:6px;
  background:var(--paper2);
  flex-shrink:0;
}
.search-row .s-info{ min-width:0; flex:1; }
.s-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15px;
  color:var(--ink);
  line-height:1.25;
}
.s-vendor{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}
.s-cat{
  display:inline-block;
  margin-top:4px;
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  color:var(--rust);
  text-transform:uppercase;
  letter-spacing:0.05em;
}

/* ---------- CODE-BARRES / IMPRESSION ---------- */
.bc-toggle{
  display:block;
  width:100%;
  text-align:center;
  margin-top:8px;
  padding:10px;
  background:none;
  border:1px solid var(--line);
  color:var(--ink);
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  font-weight:700;
  border-radius:6px;
  cursor:pointer;
}
.bc-panel{
  margin-top:10px;
  padding:14px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  text-align:center;
  display:none;
}
.bc-panel.show{ display:flex; flex-direction:column; align-items:center; }
/* Aperçu ecran : reproduit la mini-etiquette Dymo (25x54mm) pivotee comme l'original */
.bc-tag-preview{
  width:70px;
  height:150px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--white);
}
.bc-tag-preview-inner{
  width:150px;
  height:70px;
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%) rotate(-90deg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.bc-tag-preview-inner .pv-title{
  font-family:Arial,Helvetica,sans-serif;
  font-size:10px;
  max-width:140px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bc-tag-preview-inner .pv-sku{
  font-family:Arial,Helvetica,sans-serif;
  font-size:10px;
}
.bc-tag-preview-inner svg{ height:34px; }
.bc-print-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}
.bc-print-row label{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
}
.bc-qty-input{
  width:56px;
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  text-align:center;
  padding:8px 4px;
  border:1px solid var(--line);
  border-radius:6px;
}
.btn-print{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:var(--ink);
  color:var(--paper);
  border:none;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  font-size:13px;
  letter-spacing:0.03em;
  border-radius:6px;
  cursor:pointer;
}

/* zone d'impression (invisible a l'ecran, visible seulement au print) */
#printArea{ display:none; }
@media print{
  /* IMPORTANT: on utilise display:none (pas visibility:hidden) pour que
     le reste de l'appli ne laisse pas d'espace vide -> evite la 2e page blanche */
  .topbar, .scan-wrap, .controls, .tabbar, .screen, .toast{ display:none !important; }
  .overlay{ position:static !important; background:none !important; display:block !important; }
  .tag-sheet{ display:none !important; }
  #printArea{
    display:block;
  }
  @page{ size: 25mm 54mm; margin: 0; }
  .print-label{
    width:25mm;
    height:54mm;
    position:relative;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
    box-sizing:border-box;
  }
  .print-label:last-child{ page-break-after:auto; }
  /* Boite logique 54x25mm (avant rotation) positionnee et centree,
     puis pivotee -90deg pour s'imprimer verticalement comme le PDF d'origine */
  .print-label-inner{
    width:54mm;
    height:25mm;
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-90deg);
    box-sizing:border-box;
  }
  /* Positions mesurees exactement sur le PDF de reference (points -> mm) */
  .print-label .pl-title{
    position:absolute;
    top:0mm; left:0; width:54mm; height:5mm;
    display:flex; align-items:flex-end; justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    font-size:9.5pt;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }
  .print-label .pl-sku{
    position:absolute;
    top:5mm; left:0; width:54mm; height:4.5mm;
    display:flex; align-items:flex-end; justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    font-size:11pt;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }
  .print-label .pl-barcode-wrap{
    position:absolute;
    top:11.5mm; left:5mm; width:44mm; height:8.5mm;
  }
  .print-label .pl-barcode-wrap svg{
    width:100%; height:100%; display:block;
  }
  .print-label .pl-digits{
    position:absolute;
    top:20.5mm; left:0; width:54mm; height:4mm;
    display:flex; align-items:flex-start; justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    font-size:11pt;
    line-height:1;
  }
}
</style>
</head>

// Recherche tolerante : gere les ecarts frequents de scan
// (chiffre de controle en plus/en moins, zero de tete ajoute/retire)
function findItem(rawCode){
  const code = String(rawCode).trim().replace(/\s+/g,'');
  if(byBarcode[code]) return byBarcode[code];

  const candidates = new Set();
  candidates.add(code.replace(/^0+/, ''));      // zeros de tete retires
  candidates.add('0' + code);                    // zero de tete ajoute
  if(code.length > 1){
    candidates.add(code.slice(0, -1));           // dernier chiffre (checksum) retire
    candidates.add(code.slice(1));               // premier chiffre retire
  }
  for(const c of candidates){
    if(byBarcode[c]) return byBarcode[c];
  }

  // dernier recours : match par suffixe commun (6+ chiffres)
  if(code.length >= 6){
    for(const key in byBarcode){
      if(key.length >= 6 && (key.endsWith(code) || code.endsWith(key))){
        return byBarcode[key];
      }
    }
  }
  return null;
}

const CART_KEY = 'sply_scan_cart_v1';

function loadCart(){
  try{
    const raw = localStorage.getItem(CART_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCart(cart){
  try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(e){}
}
let cart = loadCart();

function addToCart(item, qty){
  const existing = cart.find(c => c.sku === item.sku);
  if(existing){
    existing.qty += qty;
  } else {
    cart.push({
      cat: item.cat, type: item.type, vendor: item.vendor, title: item.title,
      sku: item.sku, barcode: item.barcode, url: item.url, img: item.img, qty: qty
    });
  }
  saveCart(cart);
  renderTabBadge();
  renderDeliveryList();
}
function removeFromCart(sku){
  cart = cart.filter(c => c.sku !== sku);
  saveCart(cart);
  renderTabBadge();
  renderDeliveryList();
}
function clearCart(){
  cart = [];
  saveCart(cart);
  renderTabBadge();
  renderDeliveryList();
}
function renderTabBadge(){
  const badge = document.getElementById('tabBadge');
  const totalLines = cart.length;
  if(totalLines > 0){
    badge.textContent = totalLines;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}
function renderDeliveryList(){
  const list = document.getElementById('deliveryList');
  const totalEl = document.getElementById('deliveryTotal');
  if(cart.length === 0){
    list.innerHTML = `<div class="delivery-empty">Aucun article scanné pour l'instant.<br>Scanne des codes-barres et valide les quantités pour les ajouter ici.</div>`;
    totalEl.textContent = '';
    return;
  }
  let totalUnits = 0;
  list.innerHTML = cart.map(c => {
    totalUnits += c.qty;
    const photo = c.img
      ? `<img src="${escapeAttr(c.img)}" alt="">`
      : `<div class="ph"></div>`;
    return `
      <div class="delivery-row">
        ${photo}
        <div class="info">
          <div class="t">${escapeHtml(c.title)}</div>
          <div class="s">${escapeHtml(c.vendor)} · ${escapeHtml(c.sku)}</div>
        </div>
        <div class="qty">×${c.qty}</div>
        <button class="rm" onclick="removeFromCart('${escapeAttr(c.sku).replace(/'/g,"\\'")}')">×</button>
      </div>`;
  }).join('');
  totalEl.innerHTML = `${cart.length} référence(s) · <b>${totalUnits}</b> unité(s) au total`;
}

function exportExcel(){
  if(cart.length === 0) return;
  const ref = document.getElementById('deliveryRef').value.trim();
  const dateVal = document.getElementById('deliveryDate').value.trim() || new Date().toLocaleDateString('fr-FR');
  const rows = cart.map(c => ({
    'SKU': c.sku,
    'Quantité': c.qty
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:24},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Bon de livraison');
  const filename = `Bon_de_livraison${ref ? '_' + ref.replace(/[^a-z0-9]/gi,'_') : ''}_${dateVal.replace(/\//g,'-')}.xlsx`;
  XLSX.writeFile(wb, filename);
  showToast('Fichier Excel téléchargé');
}

function runSearch(){
  const q = normalize(searchInput.value.trim());
  const list = document.getElementById('searchList');
  const status = document.getElementById('searchStatus');

  let results = uniqueProducts.filter(r => activeFilter === 'Tous' || r.cat === activeFilter);
  if(q){
    results = results.filter(r =>
      normalize(r.title).includes(q) ||
      normalize(r.vendor).includes(q) ||
      normalize(r.type).includes(q)
    );
  }
  results = results.slice(0, 80);

  if(results.length === 0){
    status.textContent = 'Aucun resultat.';
    list.innerHTML = `<div class="search-empty">Aucun article ne correspond a cette recherche.<br>Essaie un autre mot, ou change de categorie.</div>`;
    return;
  }
  status.textContent = results.length + ' article(s) trouve(s)';
  list.innerHTML = results.map((r, i) => {
    const photo = r.img
      ? `<img src="${escapeAttr(r.img)}" alt="">`
      : `<div class="ph"></div>`;
    return `
      <button class="search-row" data-idx="${i}" aria-label="${escapeAttr(r.title)}, ${escapeAttr(r.vendor)}">
        ${photo}
        <div class="s-info">
          <div class="s-title">${escapeHtml(r.title)}</div>
          <div class="s-vendor">${escapeHtml(r.vendor)}</div>
          <div class="s-cat">${escapeHtml(r.cat)}</div>
        </div>
      </button>`;
  }).join('');

  list.querySelectorAll('.search-row').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      currentItem = results[i];
      currentQty = 1;
      renderStepView();
      overlay.classList.add('show');
    });
  });
}

    <div class="tag-fields">
      <div class="tag-field"><div class="lbl">SKU</div><div class="val">${escapeHtml(item.sku)}</div></div>
      <div class="tag-field"><div class="lbl">Code-barres</div><div class="val">${escapeHtml(item.barcode)}</div></div>
    </div>
    <div class="qty-block">
      <div class="qty-label">Quantité à ajouter au bon de livraison</div>
      <div class="qty-stepper">
        <button class="qty-btn" id="qtyMinus">−</button>
        <input class="qty-value" id="qtyValue" type="number" inputmode="numeric" min="1" value="${currentQty}">
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
      <button class="btn-add-cart" id="goConfirm">Valider la quantité →</button>
    </div>

    <button class="bc-toggle" id="bcToggle">Afficher le code-barres</button>
    <div class="bc-panel" id="bcPanel">
      <div class="bc-tag-preview">
        <div class="bc-tag-preview-inner">
          <div class="pv-title">${escapeHtml(item.title)}</div>
          <div class="pv-sku">${escapeHtml(item.sku)}</div>
          <svg id="bcSvg"></svg>
        </div>
      </div>
      <div class="bc-print-row">
        <label for="bcPrintQty">Nb d'étiquettes :</label>
        <input class="bc-qty-input" id="bcPrintQty" type="number" inputmode="numeric" min="1" value="1">
      </div>
      <button class="btn-print" id="bcPrintBtn">🖨️ Imprimer</button>
    </div>

    ${ctaHtml}
  `;
  const qtyInput = document.getElementById('qtyValue');
  document.getElementById('qtyMinus').addEventListener('click', () => {
    if(currentQty > 1){ currentQty--; qtyInput.value = currentQty; }
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    currentQty++; qtyInput.value = currentQty;
  });
  qtyInput.addEventListener('input', () => {
    const v = parseInt(qtyInput.value, 10);
    currentQty = (!isNaN(v) && v > 0) ? v : currentQty;
  });
  qtyInput.addEventListener('blur', () => {
    if(!qtyInput.value || parseInt(qtyInput.value,10) < 1){
      currentQty = 1;
      qtyInput.value = 1;
    }
  });
  document.getElementById('goConfirm').addEventListener('click', renderConfirmView);

  const bcPanel = document.getElementById('bcPanel');
  const bcToggle = document.getElementById('bcToggle');
  let bcRendered = false;
  bcToggle.addEventListener('click', () => {
    const showing = bcPanel.classList.toggle('show');
    bcToggle.textContent = showing ? 'Masquer le code-barres' : 'Afficher le code-barres';
    if(showing && !bcRendered){
      renderBarcodeInto('bcSvg', item.barcode);
      bcRendered = true;
    }
  });
  document.getElementById('bcPrintBtn').addEventListener('click', () => {
    const qty = Math.max(1, parseInt(document.getElementById('bcPrintQty').value, 10) || 1);
    printBarcodeLabels(item, qty);
  });
}

function renderBarcodeInto(svgId, barcodeValue){
  const svgEl = document.getElementById(svgId);
  if(!svgEl) return;
  if(!barcodeValue){
    svgEl.outerHTML = `<div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:10px;">Pas de code-barres enregistre pour cet article.</div>`;
    return;
  }
  if(typeof JsBarcode === 'undefined'){
    svgEl.outerHTML = `<div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:10px;">Bibliotheque code-barres non chargee (verifie ta connexion).</div>`;
    return;
  }
  try{
    // CODE128 : meme format que les etiquettes Dymo d'origine (pas d'EAN/UPC)
    JsBarcode(svgEl, barcodeValue, {
      format: 'CODE128',
      font: 'Arial, Helvetica, sans-serif',
      textMargin: 4,
      width: 2.4,
      height: 60,
      displayValue: true,
      fontSize: 22,
      margin: 4
    });
    const w = svgEl.getAttribute('width');
    const h = svgEl.getAttribute('height');
    if(w && h){ svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`); }
  }catch(e){
    svgEl.outerHTML = `<div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:10px;">Code-barres invalide : ${escapeHtml(barcodeValue)}</div>`;
  }
}

function printBarcodeLabels(item, qty){
  const printArea = document.getElementById('printArea');
  let html = '';
  for(let i = 0; i < qty; i++){
    html += `
      <div class="print-label">
        <div class="print-label-inner">
          <div class="pl-title">${escapeHtml(item.title)}</div>
          <div class="pl-sku">${escapeHtml(item.sku)}</div>
          <div class="pl-barcode-wrap"><svg id="printBc${i}"></svg></div>
          <div class="pl-digits">${escapeHtml(item.barcode)}</div>
        </div>
      </div>`;
  }
  printArea.innerHTML = html;
  for(let i = 0; i < qty; i++){
    const svgEl = document.getElementById('printBc' + i);
    if(item.barcode && typeof JsBarcode !== 'undefined'){
      try{
        // Barres seules (sans le texte, affiche separement en dessous comme sur le PDF d'origine)
        JsBarcode(svgEl, item.barcode, {
          format: 'CODE128',
          displayValue: false,
          width: 2,
          height: 100,
          margin: 0
        });
        svgEl.removeAttribute('width');
        svgEl.removeAttribute('height');
        svgEl.setAttribute('preserveAspectRatio', 'none');
      }catch(e){}
    }
  }
  setTimeout(() => window.print(), 150);
}

function renderConfirmView(){
  const item = currentItem;
  const photo = item.img
    ? `<img class="confirm-photo" src="${escapeAttr(item.img)}" alt="">`
    : `<div class="confirm-photo"></div>`;
  tagSheet.innerHTML = `
    <div class="tag-handle"></div>
    <button class="tag-close" onclick="closeSheet()">×</button>
    <div class="confirm-box">
      ${photo}
      <div class="confirm-title">${escapeHtml(item.title)}</div>
      <div class="confirm-qty">Ajouter <b>${currentQty}</b> unité(s) au bon de livraison ?</div>
      <div class="confirm-actions">
        <button class="btn-confirm-back" id="confirmBack">← Modifier</button>
        <button class="btn-confirm-ok" id="confirmOk">Confirmer</button>
      </div>
    </div>
  `;
  document.getElementById('confirmBack').addEventListener('click', renderStepView);
  document.getElementById('confirmOk').addEventListener('click', () => {
    addToCart(item, currentQty);
    closeSheet();
    showToast(`${currentQty} × ${item.title} ajouté${currentQty>1?'s':''}`);
  });
}

function closeSheet(){
  overlay.classList.remove('show');
}
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeSheet(); });

renderTabBadge();

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('manualBtn').addEventListener('click', () => {
  const v = document.getElementById('manualInput').value.trim();
  if(v) showResult(v);
});
document.getElementById('manualInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const v = e.target.value.trim();
    if(v) showResult(v);
  }
});

async function startScan(){
  html5Qrcode = new Html5Qrcode("reader", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  });
  try{
    await html5Qrcode.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: { width: 260, height: 130 }, aspectRatio: 1.5 },
      (decodedText) => {
        if(!scanning) return;
        scanning = false;
        stopScan();
        showResult(decodedText);
      },
      () => {}
    );
    idleState.style.display = 'none';
    viewfinder.style.display = 'block';
    scanBtn.textContent = 'Arrêter la caméra';
    scanBtn.classList.add('stop');
    scanning = true;
  }catch(err){
    idleState.querySelector('.idle-text').textContent = 'Caméra indisponible';
    idleState.querySelector('.idle-sub').textContent = 'Autorise l\'accès caméra dans les réglages de ton navigateur, ou utilise la saisie manuelle ci-dessous.';
  }
}

async function stopScan(){
  if(html5Qrcode){
    try{ await html5Qrcode.stop(); html5Qrcode.clear(); }catch(e){}
  }
  idleState.style.display = 'flex';
  viewfinder.style.display = 'none';
  scanBtn.textContent = 'Scanner un code-barres';
  scanBtn.classList.remove('stop');
  scanning = false;
}

scanBtn.addEventListener('click', () => {
  if(scanning){ stopScan(); } else { startScan(); }
});
</script>
</body>
